<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Virtual Farm Competition — CSU Ag Fest</title>
<meta name="robots" content="noindex, nofollow, noarchive" />
<meta name="description" content="Manage one acre of Colorado corn. Set hybrid, seeding rate, nitrogen and irrigation, then see your yield, nitrogen and water use efficiency, and your farm budget." />
<style>
:root{
  --canvas:#FAF8F3;--surface:#FFFFFF;--surf2:#F2EFE6;
  --green:#1E4D2B;--green-dk:#143620;--green-lt:#E7EFE8;
  --gold:#C8C372;--gold-dk:#8A7F2E;--gold-lt:#F6F3DC;
  --ink:#1B211D;--mute:#5F6F63;--line:#DFDCD0;
  --water:#2E7DA6;--nitro:#B0741C;--stand:#4E8B3C;--red:#B4432F;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --disp:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--canvas);color:var(--ink);font-family:var(--disp);-webkit-font-smoothing:antialiased}
body{min-height:100vh;padding:16px 16px 44px}
button,input{font:inherit;color:inherit}
button{background:none;border:none;cursor:pointer}
:focus-visible{outline:2px solid var(--green);outline-offset:2px;border-radius:6px}
.wrap{max-width:1060px;margin:0 auto}
.narrow{max-width:600px;margin:0 auto}
.mono{font-family:var(--mono)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px}
.pad{padding:16px}
.stack{display:flex;flex-direction:column;gap:14px}
.between{display:flex;align-items:center;justify-content:space-between}
.row{display:flex;align-items:center;gap:10px}
.eyebrow{font-family:var(--mono);font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold-dk);font-weight:600}
.eyebrow.m{color:var(--mute);font-weight:400}
.small{font-family:var(--mono);font-size:10.5px;color:var(--mute);line-height:1.65}
.link{font-family:var(--mono);font-size:12px;color:var(--mute);display:inline-flex;align-items:center;gap:5px}
.link:hover{color:var(--green)}
h1.hero{font-weight:800;letter-spacing:-.035em;font-size:clamp(34px,8.5vw,52px);line-height:1;color:var(--green)}
h2.sc{font-weight:800;letter-spacing:-.025em;font-size:clamp(23px,5.5vw,30px);line-height:1.1;margin:5px 0 6px;color:var(--green)}
.lede{color:var(--mute);font-size:14.5px;line-height:1.55;max-width:56ch}
/* header band */
.band{background:var(--green);border-radius:14px;padding:11px 15px;display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.band .lg{display:flex;align-items:center;gap:9px}
.band .badge{background:var(--gold);color:var(--green-dk);border-radius:5px;padding:3px 8px;font-weight:800;font-size:12px;letter-spacing:.03em}
.band .ttl{color:#fff;font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase}
.band .link{color:var(--gold)}
.band .link:hover{color:#fff}
/* footnote — the "what is this" box under each decision */
.fn{background:var(--green-lt);border:1px solid #CBDCCE;border-left:3px solid var(--green);border-radius:10px;padding:12px 14px}
.fn b{display:block;font-size:12.5px;color:var(--green);margin-bottom:4px;font-weight:700}
.fn span{font-size:12.5px;color:#33463A;line-height:1.6}
/* progress */
.prog{display:flex;gap:5px;margin-bottom:16px}
.prog i{flex:1;height:4px;border-radius:99px;background:var(--line)}
.prog i.on{background:var(--gold)}
.prog i.done{background:var(--green)}
/* buttons */
.btn{display:block;width:100%;border-radius:11px;padding:14px 20px;font-weight:700;font-size:16px;background:var(--green);color:#fff;transition:transform .1s}
.btn:active{transform:scale(.97)}
.btn[disabled]{opacity:.35;cursor:not-allowed}
.btn.gold{background:var(--gold);color:var(--green-dk)}
.btn.ghost{background:var(--surface);border:1px solid var(--line);color:var(--green)}
.btn.danger{background:var(--surface);border:1px solid var(--red);color:var(--red);font-size:15px}
.nav{display:flex;gap:10px}
.nav .btn{flex:1}
.nav .btn.back{flex:0 0 30%}
.field{width:100%;margin-top:7px;border-radius:11px;padding:13px 15px;background:var(--surface);border:1px solid var(--line);font-family:var(--mono);font-size:17px}
.field::placeholder{color:#9AA79E}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border-radius:999px;padding:8px 15px;font-family:var(--mono);font-size:12px;border:1px solid var(--line);color:var(--mute);background:var(--surface)}
.chip.on{background:var(--green);border-color:var(--green);color:#fff}
/* dial */
.dhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:11px}
.dname{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.dval{font-family:var(--mono);font-size:25px;font-weight:700}
.dunit{font-family:var(--mono);font-size:11px;color:var(--mute);margin-left:4px}
.step{flex:0 0 auto;border-radius:9px;padding:8px;background:var(--surf2);border:1px solid var(--line);display:flex}
.step:active{transform:scale(.9)}
input[type=range]{flex:1;height:26px;background:transparent;-webkit-appearance:none;appearance:none}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:99px;background:var(--surf2);border:1px solid var(--line)}
input[type=range]::-moz-range-track{height:6px;border-radius:99px;background:var(--surf2);border:1px solid var(--line)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;margin-top:-11px;background:var(--c,var(--green));border:3px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.25)}
input[type=range]::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:var(--c,var(--green));border:3px solid #fff}
.bar{height:4px;border-radius:99px;background:var(--surf2);overflow:hidden;margin-top:9px}
.bar>i{display:block;height:100%;border-radius:99px;opacity:.75}
/* hybrid cards */
.hgrid{display:grid;grid-template-columns:1fr;gap:8px}
.hcard{border-radius:11px;padding:11px 13px;background:var(--surface);border:1px solid var(--line);text-align:left;display:flex;align-items:center;gap:10px}
.hcard.on{background:var(--green-lt);border-color:var(--green);box-shadow:inset 0 0 0 1px var(--green)}
.hcard .co{font-family:var(--mono);font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.hcard .nm{font-weight:700;font-size:15px;display:block}
.hcard .rt{margin-left:auto;text-align:right;flex:0 0 auto}
.hcard .crm{font-family:var(--mono);font-size:11px;color:var(--gold-dk);font-weight:600}
.hcard .yv{font-family:var(--mono);font-size:15px;font-weight:700;color:var(--green)}
/* months */
.mrow{display:flex;align-items:center;gap:9px;padding:8px 0;border-bottom:1px solid var(--line)}
.mrow:last-child{border-bottom:none}
.mrow .mo{font-family:var(--mono);font-size:11.5px;width:34px;flex:0 0 auto;text-transform:uppercase;letter-spacing:.08em;color:var(--mute)}
.mrow .amt{font-family:var(--mono);font-size:15px;font-weight:700;width:48px;text-align:right;flex:0 0 auto;color:var(--water)}
.mrow .tgt{font-family:var(--mono);font-size:9px;color:var(--mute);width:44px;text-align:right;flex:0 0 auto}
.tot{display:flex;align-items:baseline;gap:7px}
.tot b{font-family:var(--mono);font-size:29px;font-weight:700;color:var(--water)}
/* nitrogen bank */
.bank{height:26px;border-radius:7px;overflow:hidden;display:flex;border:1px solid var(--line);background:var(--surf2)}
.bank i{display:block;height:100%}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:9px}
.legend span{font-family:var(--mono);font-size:10.5px;color:var(--mute);display:flex;align-items:center;gap:5px}
.legend em{width:9px;height:9px;border-radius:2px;display:inline-block;font-style:normal}
/* table */
.tbl{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:12.5px}
.tbl td{padding:7px 0;border-bottom:1px solid var(--line)}
.tbl td:last-child{text-align:right}
.tbl td:first-child{color:var(--mute)}
.tbl tr:last-child td{border-bottom:none}
.tbl tr.sum td{border-top:2px solid var(--green);padding-top:9px;font-weight:700;color:var(--green)}
/* metrics */
.metrics{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.metrics .panel{padding:12px}
.mk{font-family:var(--mono);font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.mv{font-family:var(--mono);font-size:21px;font-weight:700;margin-top:3px}
.mu{font-family:var(--mono);font-size:9px;color:var(--mute)}
.pivot-hold{position:relative;width:242px;height:242px;max-width:72vw;max-height:72vw;margin:0 auto}
.pivot-hold svg{width:100%;height:100%;display:block}
.readout{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none}
.readout .y{font-family:var(--mono);font-weight:700;font-size:clamp(31px,11vw,44px);color:var(--green);line-height:1}
.readout .u{font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--mute);margin-top:4px}
.tag{font-family:var(--mono);font-size:9px;letter-spacing:.08em;text-transform:uppercase;padding:2px 7px;border-radius:99px;border:1px solid var(--line);color:var(--mute);white-space:nowrap}
.tag.ml{border-color:var(--gold-dk);color:var(--gold-dk);background:var(--gold-lt)}
/* board */
.tabs{display:flex;gap:6px}
.tabs button{flex:1;border-radius:10px;padding:9px 4px;font-family:var(--mono);font-size:11.5px;border:1px solid var(--line);color:var(--mute);background:var(--surface)}
.tabs button.on{background:var(--green);border-color:var(--green);color:#fff}
.lb{display:flex;align-items:center;gap:11px;padding:10px 8px;border-bottom:1px solid var(--line)}
.lb:last-child{border-bottom:none}
.lb .r{font-family:var(--mono);font-size:13px;font-weight:700;width:24px;flex:0 0 auto;color:var(--mute)}
.lb .who{flex:1;min-width:0}
.lb .who b{font-weight:700;font-size:15px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lb .v{font-family:var(--mono);font-size:16px;font-weight:700;color:var(--green)}
.empty{text-align:center;padding:38px 12px;font-family:var(--mono);font-size:12px;color:var(--mute);line-height:1.7}
/* modal */
.scrim{position:fixed;inset:0;z-index:50;background:rgba(20,40,26,.55);display:flex;align-items:center;justify-content:center;padding:18px}
.sheet{width:100%;max-width:560px;max-height:86vh;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px}
.sheet p{font-size:13px;color:#39463D;line-height:1.7;margin-bottom:11px}
@media (min-width:880px){
  body{padding:24px 24px 60px}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start}
  .hgrid{grid-template-columns:1fr 1fr}
  .metrics{grid-template-columns:repeat(4,1fr)}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

</div>

const SOIL = { min:40, max:280, step:10, dflt:130 };  // soil nitrate the participant can pick
const SEASON_YEAR = 2024;  // a normal Colorado season. 2025 was drought-hit
                           // and its plots averaged 44 bu/ac less.
const N_REF = 110;
/* TAPS plots ranged from 4.1 to 19.3 inches. Past that the trees have no data
   and simply repeat their last leaf value, which drifts upward and would reward
   a participant for over-watering. The model input is capped at the top of the
   training range: extra water still costs money and still drags WUE down, it
   just cannot buy yield the data never showed. */
const IRR_MODEL_MAX = 19.3;   // lb/ac — dataset median applied N, held fixed in the model call

/* ── nitrogen ───────────────────────────────────────────────────────────── */
const NITROGEN = {
  perBushel: 1.10, recovBase: 0.52, recovPerSplit: 0.040, recovMax: 0.78,
  curve: 3.0, luxuryFrom: 1.35, luxuryRate: 0.06,
};
const nRecovery = ev => Math.min(NITROGEN.recovMax, NITROGEN.recovBase + NITROGEN.recovPerSplit*ev);
function nitrogenFactor(soilN, applied, events, attainable){
  const rec = nRecovery(events);
  const fromBag = applied*rec, avail = soilN + fromBag;
  const demand = NITROGEN.perBushel*attainable;
  const ratio = demand > 0 ? avail/demand : 1;
  const K = NITROGEN.curve, norm = 1 - Math.exp(-K);
  let f = Math.min(1, (1 - Math.exp(-K*ratio))/norm);
  if (ratio > NITROGEN.luxuryFrom) f = Math.max(0.80, f - NITROGEN.luxuryRate*(ratio-NITROGEN.luxuryFrom));
  return { f, avail, demand, ratio, rec, fromBag };
}

/* ── the irrigation months. Only the SEASON TOTAL feeds the model — the TAPS
   data records season totals only, so it cannot tell us when water mattered. ── */
const MONTHS = [
  { key:"may", label:"May", max:3, note:"Planting month. The soil profile is usually still full." },
  { key:"jun", label:"Jun", max:6, note:"Knee-high and growing. Roots are still reaching stored water." },
  { key:"jul", label:"Jul", max:9, note:"Tassel and silk. The thirstiest weeks of the season." },
  { key:"aug", label:"Aug", max:9, note:"Grain fill. Kernel weight is being set." },
  { key:"sep", label:"Sep", max:6, note:"Finishing toward black layer. Demand tapers off." },
  { key:"oct", label:"Oct", max:3, note:"Harvest window. Rarely any water left to apply." },
];

/* ── seeding rate (Medeiros et al. 2026; UMN Extension) ─────────────────── */
const STAND = { anchor:34424, anchorYield:237, slope:80, spread:29000, floor:0.85 };
function standFactor(pop, attainable){
  const opt = Math.max(26000, Math.min(40000, STAND.anchor + STAND.slope*(attainable-STAND.anchorYield)));
  return { f: Math.max(STAND.floor, 1 - Math.pow((pop-opt)/STAND.spread, 2)), opt };
}

/* ── CSU TAPS 2026 Farm Budget, April prices ────────────────────────────── */
const BUDGET = {
  /* field operations — operational + ownership, $/ac */
  landPrep:        75.50,
  herbicideApp1:    7.00,
  herbicideApp2:    7.00,
  preplantFertApp:  8.00,   // only if pre-plant N applied
  preplantIncorp:  14.00,   // only if pre-plant N applied
  planting:        22.00,
  sidedressApp:    10.00,   // only if side-dress applied
  fertigationApp:   1.15,   // per fertigation event
  irrigationEvent:  1.15,   // per irrigation event
  pivotOwnership:  19.24,
  combineHarvest:  34.85,
  grainCartOwn:     8.40,
  grainCartPerBu:   0.0205,
  /* materials & services */
  herbicides:     102.16,
  seedPerBag:     250.00,   // 80,000-seed bag
  seedsPerBag:     80000,
  optiStart:       18.25,   // 2.5 gal/ac at $7.30
  preplantMix:     63.06,   // 30 lb N + 60 lb P package
  preplantMixN:       30,   // lb N in that package
  nPerLb:           0.74,   // side-dress and fertigation N
  waterPerIn:       6.70,   // includes water and electricity
  haulPerBu:        0.20,   // $200 per 1,000 bu inside 20 miles
  scouting:        13.00,
  technology:      10.00,
  cropInsurance:   10.00,
  /* finance and overhead */
  interestRate:    0.065,
  interestMonths:      6,
  overhead:        12.42,
  cashRent:       180.00,
  /* the participant's irrigation is converted to events at this depth */
  inchesPerEvent:   1.20,
};
/* ownership (capital) share of each field operation, $/ac. Interest is charged
   only on cash expenses, so these are subtracted from the interest base — this
   is exactly how the TAPS sheet computes it. */
const OWNERSHIP = {
  "Land preparation": 11.677333, "Post Herbicide Application #1": 3.48,
  "Post Herbicide Application #2 (if needed)": 3.48, "Preplant Fertilizer Application": 3.98,
  "Preplant Fertilizer incorporation": 14.00, "Planting": 7.60375,
  "Sidedress N application": 4.971429, "Pivot Ownership Costs": 19.24,
  "Combine harvest": 16.851123, "Grain Cart": 8.40,
};

/* Line names below are taken verbatim from the CSU TAPS 2026 Farm Budget
   (April prices) so this table can be read row-against-row with the source. */
const FERT_TIMINGS = { 3:["V8","V12","R1"], 4:["V8","V12","Tassel","R1"] };

function farmBudget(st, yieldBu, totalIrr, appliedSide, appliedFert){
  const B = BUDGET;
  const irrEvents = Math.max(0, Math.round(totalIrr/B.inchesPerEvent));
  const prePlantOn = st.nPre > 0;
  const timings = FERT_TIMINGS[st.nEvents] || FERT_TIMINGS[4];
  const fertEach = appliedFert>0 ? appliedFert/timings.length : 0;

  const ops = {
    "Land preparation":                     B.landPrep,
    "Post Herbicide Application #1":        B.herbicideApp1,
    "Post Herbicide Application #2 (if needed)": B.herbicideApp2,
    "Preplant Fertilizer Application":      prePlantOn ? B.preplantFertApp : 0,
    "Preplant Fertilizer incorporation":    prePlantOn ? B.preplantIncorp : 0,
    "Planting":                             B.planting,
    "Sidedress N application":              appliedSide>0 ? B.sidedressApp : 0,
  };
  for (const t of timings) ops["Fertigation N at "+t] = appliedFert>0 ? B.fertigationApp : 0;
  ops["Irrigation ("+irrEvents+" events)"] = irrEvents*B.irrigationEvent;
  ops["Pivot Ownership Costs"]             = B.pivotOwnership;
  ops["Combine harvest"]                   = B.combineHarvest;
  ops["Grain Cart"]                        = yieldBu*B.grainCartPerBu + B.grainCartOwn;

  const mats = {
    "Herbicides":                                   B.herbicides,
    "Corn Hybrid seed":                             (st.pop/B.seedsPerBag)*B.seedPerBag,
    "OptiStart gold (6-20-5-2S-0.05Mn-0.1Zn)":      B.optiStart,
    "Preplant mix - 30 lbs/ac N, 60 lbs/ac P":      B.preplantMix*(st.nPre/B.preplantMixN),
    "Sidedress N":                                  appliedSide*B.nPerLb,
  };
  for (const t of timings) mats["Fertigation N at "+t] = fertEach*B.nPerLb;
  mats["Irrigation total, linear VRI"] = totalIrr*B.waterPerIn;
  mats["Grain Hauling"]                = yieldBu*B.haulPerBu;
  mats["Grain Drying"]                 = 0;      // grain assumed at 15.5% moisture
  mats["Scouting and imagry"]          = B.scouting;
  mats["Technology"]                   = B.technology;
  mats["Marketing service"]            = 0;      // "No" in the source budget
  mats["Crop Insurance"]               = B.cropInsurance;

  const sum = o => Object.values(o).reduce((a,b)=>a+b,0);
  const opsTotal = sum(ops), matsTotal = sum(mats);
  const subtotal = opsTotal + matsTotal;
  // Interest is charged on cash expenses only, so ownership (capital) costs are
  // subtracted from the base — this is how the source sheet computes it.
  let ownTotal = 0;
  for (const k in ops) if (ops[k] > 0 && OWNERSHIP[k]) ownTotal += OWNERSHIP[k];
  const cashBase = matsTotal + (opsTotal - ownTotal);
  const interest = cashBase * B.interestRate * (B.interestMonths/12);
  const total = subtotal + interest + B.overhead + B.cashRent;
  return { ops, mats, opsTotal, matsTotal, subtotal, interest, cashBase, ownTotal,
           overhead:B.overhead, cashRent:B.cashRent, total, irrEvents, timings,
           perBushel: yieldBu>0 ? total/yieldBu : null };
}

/* ── XGBoost evaluator (exported from the CSU AI Team pipeline) ─────────── */
function modelPredict(totalIrr, crm, soilN){
  const t = Math.min(totalIrr, IRR_MODEL_MAX);
  const x = [soilN, N_REF, t, t/Math.max(N_REF,0.1), crm, SEASON_YEAR];
  let s = MODEL.base_score;
  for (const t of MODEL.trees){
    let i = 0;
    while (Array.isArray(t[i])){ const n = t[i]; i = (x[n[0]] < n[1]) ? n[2] : n[3]; }
    s += t[i];
  }
  return s;
}

function evaluate(st){
  const totalIrr = MONTHS.reduce((a,m)=>a+(st.irr[m.key]||0), 0);
  const appliedN = st.nPre + st.nSide + st.nFert;
  const h = MODEL.hybrids.find(x=>x.name===st.hybrid) || MODEL.hybrids[0];

  const attainable = modelPredict(totalIrr, h.crm, st.soilN);
  const events = (st.nPre>0?1:0) + (st.nSide>0?1:0) + (st.nFert>0?st.nEvents:0);
  const N  = nitrogenFactor(st.soilN, appliedN, events, attainable);
  const sd = standFactor(st.pop, attainable);
  // beyond the training range, extra water leaches nitrogen and waterlogs roots
  const wet = Math.max(0.70, 1 - 0.02*Math.max(0, totalIrr - IRR_MODEL_MAX));
  const yieldBu = Math.max(0, attainable*N.f*sd.f*wet);
  const cost = farmBudget(st, yieldBu, totalIrr, st.nSide, st.nFert);

  return { totalIrr, appliedN, events, hybrid:h, attainable, N, sf:sd.f, wet, popOpt:sd.opt,
           yieldBu, cost,
           nue: appliedN>0 ? yieldBu/appliedN : null,
           wue: totalIrr>0 ? yieldBu/totalIrr : null };
}

function pivotSVG(){
  const Z=242,c=Z/2,R=c-5; let rings="";
  for(let k=1;k<=14;k++) rings+=`<circle cx="${c}" cy="${c}" r="${(R/14)*k}" fill="none" stroke="rgba(255,255,255,.45)" stroke-width="1.3"/>`;
  return `<svg viewBox="0 0 ${Z} ${Z}" role="img" aria-label="Centre pivot field filling in">
    <rect x="2" y="2" width="${Z-4}" height="${Z-4}" rx="12" fill="#F2EFE6" stroke="var(--line)"/>
    <circle cx="${c}" cy="${c}" r="${R}" fill="#E4E0D2"/>
    <defs><clipPath id="pc"><circle cx="${c}" cy="${c}" r="${R}"/></clipPath></defs>
    <g clip-path="url(#pc)"><path id="sweep" d="" fill="#4E8B3C"/>${rings}</g>
    <line id="arm" x1="${c}" y1="${c}" x2="${c}" y2="${c-R}" stroke="var(--green)" stroke-width="2.5" stroke-linecap="round"/>
    <circle id="tip" cx="${c}" cy="${c-R}" r="4" fill="var(--green)"/>
    <circle cx="${c}" cy="${c}" r="${R*0.53}" fill="#fff" stroke="var(--line)"/></svg>`;
}
function runPivot(instant){
  const Z=242,c=Z/2,R=c-5,r=S.result;
  const sw=document.getElementById("sweep"),arm=document.getElementById("arm"),
        tip=document.getElementById("tip"),num=document.getElementById("yNum"),rv=document.getElementById("reveal");
  if(!sw) return;
  const v=Math.max(0,Math.min(1,r.yieldBu/230));
  sw.setAttribute("fill",`rgb(${Math.round(196-120*v)},${Math.round(178-40*v)},${Math.round(120-60*v)})`);
  const reduced=window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const dur=(instant||reduced)?1:2000,t0=performance.now();
  (function f(now){
    const p=Math.min(1,(now-t0)/dur),e=1-Math.pow(1-p,3),a=e*359.99,rad=(a-90)*Math.PI/180;
    const x=c+R*Math.cos(rad),y=c+R*Math.sin(rad);
    sw.setAttribute("d",`M ${c} ${c} L ${c} ${c-R} A ${R} ${R} 0 ${a>180?1:0} 1 ${x} ${y} Z`);
    arm.setAttribute("x2",x);arm.setAttribute("y2",y);tip.setAttribute("cx",x);tip.setAttribute("cy",y);
    num.textContent=(r.yieldBu*e).toFixed(0);
    if(p<1) requestAnimationFrame(f); else if(rv) rv.style.opacity=1;
  })(performance.now());
}

const LIMITS={ soilN:[SOIL.min,SOIL.max,SOIL.step], pop:[20000,44000,1000],
  nPre:[0,30,10], nSide:[0,250,25], nFert:[0,50,10] };
MONTHS.forEach(m=>LIMITS["irr."+m.key]=[0,m.max,0.5]);
const getV=k=>k.startsWith("irr.")?S.irr[k.slice(4)]:S[k];
const setV=(k,v)=>{ if(k.startsWith("irr.")) S.irr[k.slice(4)]=v; else S[k]=v; };
function fmtV(k,v){ if(k==="pop") return (v/1000).toFixed(0)+"k";
  if(k.startsWith("irr.")) return v.toFixed(1)+'"'; return String(v); }

function refreshN(){
  const applied=S.nPre+S.nSide+S.nFert;
  const ev=(S.nPre>0?1:0)+(S.nSide>0?1:0)+(S.nFert>0?S.nEvents:0);
  const rec=nRecovery(ev), fromBag=applied*rec, avail=S.soilN+fromBag;
  const scale=Math.max(400,avail*1.12);
  const set=(id,v)=>{const el=document.getElementById(id); if(el) el.textContent=v;};
  const na=document.getElementById("nAvail");
  if(na) na.innerHTML=`${avail.toFixed(0)}<span class="dunit">lb/ac available</span>`;
  const s1=document.getElementById("bkSoil"); if(s1) s1.style.width=(100*S.soilN/scale)+"%";
  set("soilLb",S.soilN);
  const s2=document.getElementById("bkBag"); if(s2) s2.style.width=(100*fromBag/scale)+"%";
  set("bagLb",fromBag.toFixed(0));
}
function setInput(k,val,fromSlider){
  const L=LIMITS[k];
  val=Math.min(L[1],Math.max(L[0],Math.round(val/L[2])*L[2]));
  setV(k,Math.round(val*100)/100);
  const o=document.getElementById("v-"+k); if(o) o.textContent=fmtV(k,getV(k));
  const b=document.getElementById("b-"+k); if(b) b.style.width=(((getV(k)-L[0])/(L[1]-L[0]))*100)+"%";
  const rg=document.getElementById("r-"+k); if(rg&&!fromSlider) rg.value=getV(k);

  const sc=document.getElementById("seedCost");
  if(sc) sc.innerHTML=`$${((S.pop/BUDGET.seedsPerBag)*BUDGET.seedPerBag).toFixed(0)}<span class="dunit">/ac</span>`;
  refreshN();
  const it=document.getElementById("irrTot");
  if(it){ const t=MONTHS.reduce((a,m)=>a+S.irr[m.key],0);
    it.textContent=t.toFixed(1);
    const ic=document.getElementById("irrCost"); if(ic) ic.textContent=`$${(t*BUDGET.waterPerIn).toFixed(0)}/ac of water and power`;
    const ew=document.getElementById("extraWarn"); if(ew) ew.style.display=t>19.3?"block":"none";}
}

function postScore(){
  const r=S.result,c=r.cost;
  const e={ id:Date.now()+"-"+Math.random().toString(36).slice(2,7),
    name:S.name.trim()||"Anonymous", group:S.group, soilN:S.soilN,
    hybrid:r.hybrid.name, company:r.hybrid.company, crm:r.hybrid.crm, pop:S.pop,
    nPre:S.nPre, nSide:S.nSide, nFert:S.nFert, nEvents:S.nEvents, n:r.appliedN,
    months:Object.assign({},S.irr), irr:r.totalIrr, irrEvents:c.irrEvents,
    nAvail:r.N.avail, nDemand:r.N.demand, nRatio:r.N.ratio, nRec:r.N.rec,
    attainable:r.attainable, fN:r.N.f, sf:r.sf, wet:r.wet, yieldBu:r.yieldBu,
    nue:r.nue, wue:r.wue,
    cOps:c.opsTotal, cMats:c.matsTotal, cInt:c.interest, cOver:c.overhead,
    cRent:c.cashRent, cTotal:c.total, ts:Date.now() };
  const all=readBoard(); all.push(e); writeBoard(all);
  S.rank=all.slice().sort((a,b)=>b.yieldBu-a.yieldBu).findIndex(x=>x.id===e.id)+1;
  S.saved=true; S.tab="yield"; render();
}

/* ── render + events ────────────────────────────────────────────────────── */
function render(){
  const V={ welcome, soil:soilScreen, hybrid:hybridScreen, seed:seedScreen, nitrogen:nitrogenScreen,
            water:waterScreen, budget:budgetScreen, result:resultScreen, board:boardScreen };
  view.innerHTML=(V[S.view]||welcome)();
  if(S.view==="result") runPivot(S.saved);
}
document.addEventListener("input",e=>{
  const t=e.target;
  if(t.id==="nameIn"){ S.name=t.value;
    const b=document.getElementById("startBtn");
    if(b){ if(S.name.trim()) b.removeAttribute("disabled"); else b.setAttribute("disabled",""); } }
  if(t.dataset&&t.dataset.slide) setInput(t.dataset.slide,parseFloat(t.value),true);
});
document.addEventListener("click",e=>{
  if(!e.target.closest) return;
  if((e.target.classList&&e.target.classList.contains("scrim"))||e.target.closest("button[data-close]")){ closeModal(); return; }
  const el=e.target.closest("[data-go],[data-group],[data-hyb],[data-bump],[data-tab],[data-ev],button");
  if(!el) return;
  if(el.dataset.group){ S.group=el.dataset.group; render(); return; }
  if(el.dataset.hyb){ S.hybrid=el.dataset.hyb; render(); return; }
  if(el.dataset.tab){ S.tab=el.dataset.tab; render(); return; }
  if(el.dataset.ev){ S.nEvents=parseInt(el.dataset.ev,10); render(); return; }
  if(el.dataset.bump){ const k=el.dataset.bump; setInput(k,getV(k)+parseInt(el.dataset.dir,10)*LIMITS[k][2]); return; }
  if(el.dataset.go){
    const g=el.dataset.go;
    if(g==="result"){ S.result=evaluate(S); S.saved=false; S.rank=null; }
    if(g==="soil"&&(S.view==="result"||S.view==="board")){ S.saved=false; S.result=null; }
    go(g); return;
  }
  switch(el.id){
    case "aboutBtn": openAbout(); break;
    case "postBtn": postScore(); break;
    case "xlBtn": exportMine(); break;
    case "allBtn": exportAll(); break;
    case "clearBtn":
      if(!S.confirmClear){ S.confirmClear=true; openAdmin(); }
      else { writeBoard([]); closeModal(); render(); }
      break;
  }
});
let taps=0,tt=null;
document.getElementById("mark").addEventListener("click",()=>{
  taps++; clearTimeout(tt); tt=setTimeout(()=>taps=0,1600);
  if(taps>=5){ taps=0; S.confirmClear=false; openAdmin(); }
});
document.addEventListener("keydown",e=>{ if(e.key==="Escape") closeModal(); });
render();

</script>
</body>
